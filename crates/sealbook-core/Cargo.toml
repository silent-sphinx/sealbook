[package]
name = "sealbook-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
base64.workspace = true
sealbook-crypto = { path = "../sealbook-crypto" }
sealbook-protocol = { path = "../sealbook-protocol" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tsify = { version = "0.5", default-features = false, features = ["js"], optional = true }
uniffi = { version = "0.32", optional = true }
uuid = { workspace = true }
wasm-bindgen = { workspace = true, optional = true }
zeroize.workspace = true

[dev-dependencies]
serde_json.workspace = true

[features]
# Binding plumbing, off by default so the CLI links plain Rust.
wasm = ["dep:tsify", "dep:wasm-bindgen", "uuid/js"]
uniffi = ["dep:uniffi"]

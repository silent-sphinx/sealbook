[package]
name = "sealbook-strength"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "The password strength check as its own wasm module, so the main one does not carry zxcvbn's dictionaries."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
sealbook-core = { path = "../sealbook-core", features = ["wasm", "strength"] }
serde-wasm-bindgen = "0.6"
wasm-bindgen.workspace = true
# Core links getrandom for key generation even though this module never calls it,
# and on wasm32 that needs the JS backend selected.
getrandom = { version = "0.2", features = ["js"] }
getrandom_04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }
uuid = { workspace = true, features = ["js"] }

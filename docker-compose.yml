services:
  sealbook:
    image: sealbook:local
    container_name: sealbook
    restart: always
    # The server drains in-flight requests for up to 20s on SIGTERM; give Docker
    # enough patience not to SIGKILL it part way through a key rotation.
    stop_grace_period: 30s
    ports:
      - "8443:8443"
    environment:
      SEALBOOK_DATA_DIR: /data
      SEALBOOK_ENV: production
      RUST_LOG: sealbook_server=info
      SEALBOOK_CORS_ORIGINS: https://your-frontend-domain.example
      # Uncomment once your accounts exist. Signups are refused; existing
      # accounts, logins and device pairing carry on as normal.
      # SEALBOOK_DISABLE_REGISTRATION: 1
      # Where the certificate clients check comes from:
      #   self-signed  generated here and pinned by clients (home network, VPN, bare IP)
      #   provided     you supply /data/tls/cert.pem and key.pem (public domain name)
      #   proxy        a reverse proxy holds it; set SEALBOOK_TRUSTED_PROXIES too
      SEALBOOK_TLS_MODE: self-signed
      # In self-signed mode, the hostnames and IP addresses clients will use.
      # Clients check the name in their URL against the certificate even though
      # they pin it, so an address missing here fails the handshake. localhost,
      # 127.0.0.1, 0.0.0.0 and 10.0.2.2 are always covered.
      # SEALBOOK_TLS_SANS: sealbook.lan,10.88.42.134
    volumes:
      - sealbook-data:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  sealbook-data:

[workspace]
resolver = "2"
members = [
    "crates/sealbook-crypto",
    "crates/sealbook-protocol",
    "crates/sealbook-client",
    "crates/sealbook-server",
    "crates/sealbook-cli",
    "crates/sealbook-wasm",
    "crates/sealbook-android",
]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
version = "0.1.0"
# `as_chunks` in sealbook-crypto, and the highest `rust-version` in the resolved
# dependency graph, are both 1.88.
rust-version = "1.88"

[workspace.dependencies]
anyhow = "1"
argon2 = "0.5"
axum = "0.8"
base64 = "0.22"
chacha20poly1305 = "0.10"
clap = { version = "4", features = ["derive"] }
ed25519-dalek = { version = "2", features = ["rand_core", "zeroize"] }
hex = "0.4"
keyring = "3"
hkdf = "0.12"
hmac = "0.12"
hpke = { version = "0.14", default-features = false, features = ["x25519", "mlkem", "hkdfsha2", "getrandom", "chacha", "alloc"] }
ml-dsa = { version = "0.1", features = ["getrandom"] }
opaque-ke = { version = "4", features = ["argon2", "ristretto255"] }
rand = "0.8"
rpassword = "7"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "fs", "io-util", "sync", "time", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
zeroize = { version = "1", features = ["zeroize_derive"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "logging", "std", "prefer-post-quantum"] }
rustls-pki-types = "1"
axum-server = { version = "0.8", features = ["tls-rustls-no-provider"] }
rcgen = "0.13"
time = { version = "0.3", default-features = false, features = ["std", "formatting", "parsing"] }
webpki-roots = "1"
tower = { version = "0.5", features = ["limit"] }
tower-http = { version = "0.6", features = ["cors", "timeout"] }
wasm-bindgen = "0.2"
js-sys = "0.3"
console_error_panic_hook = "0.1"
